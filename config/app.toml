[server]
host = "0.0.0.0"
port = 9800
allow_public = false

[general]
language = "zh"
theme = "dark"
log_level = "info"
check_updates = true

[compute]
strategy = "least_memory"
disabled_backends = []
refresh_interval_secs = 5
allow_overcommit = false

[ports]
range_start = 18000
range_end = 19000

[models]
cache_dir = "./models"
hf_endpoint = "https://huggingface.co"
default_source = "huggingface"
max_concurrent_downloads = 2
# 本地模型缓存搜索路径（按优先级排序），用于发现用户已有的模型文件
cache_paths = []

[python]
path = "python"
uv_path = "uv"

[pipeline]
max_parallel = 2
default_timeout_secs = 300
keep_workspace = false
workspace_dir = "./workspace"

[ui]
scale_factor = 1.0
font_size = 14.0
dashboard_refresh_secs = 2
