[server]
host = "127.0.0.1"
port = 9800
allow_public = false

[general]
language = "zh-CN"
theme = "dark"
log_level = "info"
check_updates = true

[compute]
strategy = "least_memory"
disabled_backends = []
refresh_interval_secs = 5
allow_overcommit = false
single_device = "vulkan:0"
cuda_libs_dir = "runtime/cuda-libs"

[ports]
range_start = 18000
range_end = 19000

[models]
cache_dir = "models"
hf_endpoint = "https://huggingface.co"
default_source = "huggingface"
max_concurrent_downloads = 2
cache_paths = []

[python]
path = "python"
uv_path = "uv"
uv_cache_dir = "runtime/.uv-cache"
constraints = "config/constraints.txt"

[pipeline]
max_parallel = 2
default_timeout_secs = 300
default_node_timeout_secs = 0
keep_workspace = false
workspace_dir = "workspace"
staging_mode = "auto"
staging_floor_mb = 2048
staging_max_ram_mb = 0

[network]
http_proxy = ""
https_proxy = ""
no_proxy = "localhost,127.0.0.1"

[packs]
staging_dir = ".pack-staging"

[modules]
idle_timeout_secs = 1800

[api]
enabled = true

[active_models]
realesr = "realesrgan-animevideov3-x4-ncnn"
qwen3-tts = "0.6b"
