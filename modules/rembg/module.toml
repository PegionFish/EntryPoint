[module]
id = "rembg"
name = "RemBG 智能去背景"
version = "2.2.0"
description = "基于 U2-Net/ISNet/BiRefNet 的 AI 图像背景移除（ONNX Runtime 多 EP）"
category = "image"
genre = "rembg"
authors = ["EntryPoint Community"]
license = "MIT"
homepage = "https://github.com/danielgatis/rembg"
tags = ["background-removal", "segmentation", "image", "matting"]

[runtime]
type = "python"
python_version = ">=3.10,<3.13"
requirements = "requirements.txt"
entrypoint = "adapter.py"
start_command = "{venv_python} {MODULE_DIR}/{entrypoint}"
# M2：openvino 后端换装 onnxruntime-openvino（与官方 onnxruntime 同包命名空间、
# 互斥不可共存，故不能与基础 requirements.txt 的 rembg[cpu] 栈同 venv）。
# 其余后端无对应条目时按规范回退 runtime.requirements（cpu 基础栈）。
requirements_by_backend = { openvino = "requirements-openvino.txt" }

# 后端诚实声明（2026-08-22，W1/WS-C）：
# - openvino：经 onnxruntime-openvino 的 OpenVINOExecutionProvider 执行，
#   设备由 OPENVINO_DEVICE={device_name} 注入（E2=NPU.0 /dev/accel0、
#   E3=GPU.0 Arrow Lake iGPU 实验载体）；u2net/isnet ONNX 直接吃 EP，模型不变。
# - cpu：rembg[cpu] 基础栈兜底，始终可用。
# - cuda：本期不做——ORT 各发行 wheel 共享 `onnxruntime` 包名、单 venv 互斥；
#   待 M3 分后端 venv 全量铺开后再评估 onnxruntime-gpu 路线，未验证不声明。
# default_backend 暂取 cpu；E2/E3 真机验证通过后可上调 openvino。
[compute]
backends = ["openvino", "cpu"]
default_backend = "cpu"
vram_estimate_mb = 512
min_vram_mb = 256

[compute.env]
openvino = { OPENVINO_DEVICE = "{device_name}" }

[[models]]
id = "u2net"
name = "U2-Net (通用)"
source = "url"
url = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx"
target_dir = "rembg-u2net"
sha256 = "8d10d2f3bb75ae3b6d527c77944fc5e7dcd94b29809d47a739a7a728a912b491" # u2net.onnx
size_estimate_mb = 176
vram_estimate_mb = 512
default = true

[[models]]
id = "isnet-general-use"
name = "ISNet (高精度)"
source = "url"
url = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx"
target_dir = "rembg-isnet"
sha256 = "60920e99c45464f2ba57bee2ad08c919a52bbf852739e96947fbb4358c0d964a" # isnet-general-use.onnx
size_estimate_mb = 176
vram_estimate_mb = 512

[[models]]
id = "birefnet-general"
name = "BiRefNet (最新)"
source = "url"
url = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/BiRefNet-general-epoch_244.onnx"
target_dir = "rembg-birefnet"
size_estimate_mb = 880
vram_estimate_mb = 2048

# 补位变体（源应用 RemBg 全量 6 模型，冻结契约 §4.3 A5）：
# 权重文件名即 id 名（u2netp.onnx 等），target_dir 与 id 相同，
# 由 W2 经「本地导入」从源 models/ 目录落入（.ep_meta source="local"）。
[[models]]
id = "u2netp"
name = "U2-Net 轻量版 (低耗)"
source = "url"
url = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx"
target_dir = "u2netp"
sha256 = "309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8" # u2netp.onnx
size_estimate_mb = 5
vram_estimate_mb = 256

[[models]]
id = "u2net_human_seg"
name = "U2-Net 人像分割"
source = "url"
url = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_human_seg.onnx"
target_dir = "u2net_human_seg"
sha256 = "01eb6a29a5c4d8edb30b56adad9bb3a2a0535338e480724a213e0acfd2d1c73c" # u2net_human_seg.onnx
size_estimate_mb = 176
vram_estimate_mb = 512

[[models]]
id = "isnet-anime"
name = "ISNet 动漫图"
