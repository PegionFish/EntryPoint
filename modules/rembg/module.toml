sha256 = "f15622d853e8260172812b657053460e20806f04b9e05147d49af7bed31a6e99" # isnet-anime.onnx
size_estimate_mb = 176
vram_estimate_mb = 512

[[models]]
id = "u2net_cloth_seg"
name = "U2-Net 服装分割"
source = "url"
url = "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_cloth_seg.onnx"
target_dir = "u2net_cloth_seg"
sha256 = "6d2cbc27bfbdc989e1fd325656d65902ecc6a3ccbe94b2d3655ec114efcb128e" # u2net_cloth_seg.onnx
size_estimate_mb = 176
vram_estimate_mb = 512

[interface]
type = "http"
health_endpoint = "/health"
ready_timeout_secs = 60

[[interface.capabilities]]
name = "remove_bg"
description = "移除图片背景，输出透明 PNG"
input_type = "image"
output_type = "image"
max_file_size_mb = 50

[interface.capabilities.params]
alpha_matting = { type = "boolean", default = false, description = "启用 alpha matting 精细边缘（仅 isnet-general-use/birefnet-general 支持；其余模型自动降级为 false 并提示）" }
post_process = { type = "boolean", default = true, description = "后处理优化边缘" }
