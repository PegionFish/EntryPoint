[module]
id = "faster-whisper"
name = "Faster-Whisper ASR"
version = "1.1.0"
description = "基于 CTranslate2 的高速语音识别，支持词级时间戳和多语言"
category = "asr"
genre = "whisper"
authors = ["EntryPoint Community"]
license = "MIT"
homepage = "https://github.com/SYSTRAN/faster-whisper"
tags = ["speech", "recognition", "multilingual", "timestamps"]

[runtime]
type = "python"
python_version = ">=3.10,<3.13"
requirements = "requirements.txt"
# M2/M3 接线：按当前后端选依赖文件；cpu 无条目 → 回退 requirements.txt（CPU 兜底口径）。
# rocm 侧 ctranslate2 的占位 pin + HIP 轮子覆盖两步法见 requirements-rocm.txt 头注与
# scripts/hetero/whisper-rocm/README.md
requirements_by_backend = { rocm = "requirements-rocm.txt", cuda = "requirements-cuda.txt" }
entrypoint = "adapter.py"
start_command = "{venv_python} {MODULE_DIR}/{entrypoint}"

[compute]
backends = ["cuda", "rocm", "cpu"]
default_backend = "cuda"
vram_estimate_mb = 4096
min_vram_mb = 2048

[compute.env]
cuda = { CUDA_VISIBLE_DEVICES = "{device_index}" }
# HSA_OVERRIDE_GFX_VERSION 说明（2026-08-22 调研，证据见 scripts/hetero/whisper-rocm/README.md §3）：
# gfx1100（RX 7900 XTX / RDNA3）无需设置——CTranslate2 官方 ROCm wheel（≥v4.7.1，pin v4.8.1）
# 已把 gfx1100 编译为内置 GPU 内核。仅未收录架构才需 override（如 RDNA2 gfx1032 → "10.3.0"，
# 且另需 CT2_CUDA_ALLOCATOR=cub_caching）。TOML inline table 内不支持注释，故说明置于键上方；
# rocm 注入保持最小集。
rocm = { HIP_VISIBLE_DEVICES = "{device_index}" }

[[models]]
id = "large-v3"
name = "Whisper Large V3 (最高精度)"
source = "huggingface"
repo_id = "Systran/faster-whisper-large-v3"
target_dir = "faster-whisper-large-v3"
size_estimate_mb = 3100
default = true

[[models.mirrors]]
source = "modelscope"
repo_id = "pengzhendong/faster-whisper-large-v3"

[[models]]
id = "medium"
name = "Whisper Medium (平衡)"
source = "huggingface"
repo_id = "Systran/faster-whisper-medium"
target_dir = "faster-whisper-medium"
size_estimate_mb = 1500

[[models.mirrors]]
source = "modelscope"
repo_id = "pengzhendong/faster-whisper-medium"

[[models]]
id = "small"
name = "Whisper Small (轻量)"
source = "huggingface"
repo_id = "Systran/faster-whisper-small"
target_dir = "faster-whisper-small"
size_estimate_mb = 500

[[models.mirrors]]
source = "modelscope"
repo_id = "pengzhendong/faster-whisper-small"

[[models]]
id = "tiny"
name = "Whisper Tiny (最小)"
source = "huggingface"
repo_id = "Systran/faster-whisper-tiny"
target_dir = "faster-whisper-tiny"
size_estimate_mb = 75

[[models]]
id = "tiny-en"
name = "Whisper Tiny English"
source = "huggingface"
repo_id = "Systran/faster-whisper-tiny.en"
target_dir = "faster-whisper-tiny.en"
size_estimate_mb = 75

[[models]]
id = "base"
name = "Whisper Base (快速)"
source = "huggingface"
repo_id = "Systran/faster-whisper-base"
target_dir = "faster-whisper-base"
size_estimate_mb = 145

[[models]]
id = "base-en"
name = "Whisper Base English"
source = "huggingface"
repo_id = "Systran/faster-whisper-base.en"
target_dir = "faster-whisper-base.en"
size_estimate_mb = 145

[[models]]
id = "small-en"
name = "Whisper Small English"
source = "huggingface"
repo_id = "Systran/faster-whisper-small.en"
target_dir = "faster-whisper-small.en"
size_estimate_mb = 500

[[models]]
id = "medium-en"
name = "Whisper Medium English"
source = "huggingface"
repo_id = "Systran/faster-whisper-medium.en"
target_dir = "faster-whisper-medium.en"
size_estimate_mb = 1500

[[models]]
id = "large-v1"
name = "Whisper Large V1"
source = "huggingface"
repo_id = "Systran/faster-whisper-large-v1"
target_dir = "faster-whisper-large-v1"
size_estimate_mb = 3100

[[models]]
id = "large-v2"
name = "Whisper Large V2"
source = "huggingface"
repo_id = "Systran/faster-whisper-large-v2"
target_dir = "faster-whisper-large-v2"
size_estimate_mb = 3100

[interface]
type = "http"
health_endpoint = "/health"
ready_timeout_secs = 90

[[interface.capabilities]]
name = "transcribe"
description = "语音转文字，支持词级时间戳"
input_type = "audio"
output_type = "json"
max_file_size_mb = 2048

[interface.capabilities.params]
precision = { type = "select", options = ["float16", "int8"], default = "float16", description = "推理精度；CPU 自动锁定 int8" }
language = { type = "string", default = "auto", description = "语言代码或 auto" }
timestamps = { type = "boolean", default = true, description = "输出词级时间戳" }
beam_size = { type = "integer", default = 5, min = 1, max = 20 }
vad_filter = { type = "boolean", default = true, description = "VAD 静音过滤" }
condition_on_previous = { type = "boolean", default = true, description = "上下文条件推理" }
