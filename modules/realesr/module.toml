[module]
id = "realesr"
name = "RealESR 视频超分"
version = "0.1.0"
description = "视频超分（RealESR/RealESRGAN 主线家族）：realesr-animevideov3 轻量与 x4plus 通用公版权重，torch(CUDA/ROCm) 主路线 + OpenVINO ONNX(Intel) + ncnn-vulkan 兜底。同功能域的 RealESRGANv2-animevideo 系另立 animevideo 模块（按模型家族拆分）"
category = "video"
genre = "upscale"
authors = ["EntryPoint Community"]
license = "BSD-3-Clause"
homepage = "https://github.com/xinntao/Real-ESRGAN"
tags = ["video", "upscale", "super-resolution", "realesr", "realesrgan", "experimental"]

[runtime]
type = "python"
python_version = ">=3.10,<3.13"
requirements = "requirements.txt"
entrypoint = "adapter.py"
start_command = "{venv_python} {MODULE_DIR}/{entrypoint}"

# ncnn 兜底引擎二进制相对路径（vulkan 后端消费）。
# 二进制不随模块包分发（计划 §3.2：统一用 nihui/xinntao 上游官方 release，
# 禁用 W2xEX 重编译版）；获取与放置步骤见 README「引擎二进制放置」。
# 注：type=python 模块复用 [runtime.binaries] 键位词表，adapter 自行解析，
# 平台 {binary} 替换不参与 python 运行时。
[runtime.binaries]
linux-x86_64 = "bin/linux-x86_64/realesrgan-ncnn-vulkan"
windows-x86_64 = "bin/windows-x86_64/realesrgan-ncnn-vulkan.exe"

[compute]
backends = ["cuda", "rocm", "openvino", "vulkan", "cpu"]
default_backend = "cuda"
vram_estimate_mb = 2048
min_vram_mb = 1024
notes = "EXPERIMENTAL：E6/E7/E8 载体，三运行时分层——cuda/rocm/cpu=torch(.pth)，openvino=ORT-OV(.onnx 变体占位待补，当前恒返回 501)，vulkan=ncnn 引擎子进程(需按 README 放置 bin/)；任一后端真机验证(E4/E7/E8)通过前均视为实验性。torch 依赖见 requirements-torch.txt（M2 requirements_by_backend 消费落地前需手动安装）"

[compute.env]
cuda = { CUDA_VISIBLE_DEVICES = "{device_index}" }
rocm = { HIP_VISIBLE_DEVICES = "{device_index}", TORCH_DEVICE = "cuda" }
openvino = { OPENVINO_DEVICE = "{device_name}" }
cpu = { TORCH_DEVICE = "cpu" }

# schema 冻结待消费（MODULE_SPEC §2.6）：平台 M2 落地后按后端选装依赖；
# 当前仅 requirements.txt 进 venv，torch/OV 栈手动或经上述文件补装
[runtime.requirements_by_backend]
cuda = "requirements-torch.txt"
rocm = "requirements-torch.txt"
openvino = "requirements-openvino.txt"

# ---- 权重变体：torch .pth（BSD-3 官方公版，xinntao GitHub release 直链）----

# ---- 权重变体：torch .pth（BSD-3 官方公版，xinntao GitHub release 直链）----
# 家族拆分说明（模块 = 模型家族）：RealESRGANv2-animevideo-* 两款迁往
# modules/animevideo 独立模块；本模块只保留 realesr 主线与 x4plus 通用系。

[[models]]
id = "realesr-animevideov3-pth"
name = "RealESRGAN animevideov3 x4 (视频轻量·默认·pth)"
source = "url"
url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.pth"
target_dir = "realesr-animevideov3-x4-pth"
size_estimate_mb = 3
default = true
qualified_id = "xinntao.realesrgan.realesr-animevideov3-x4"

[[models]]
id = "realesrgan-x4plus-pth"
name = "RealESRGAN x4plus (通用照片级·pth)"
source = "url"
url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth"
target_dir = "realesrgan-x4plus-pth"
size_estimate_mb = 64
qualified_id = "xinntao.realesrgan.x4plus"

# （RealESRGANv2-animevideo-xsx2 / xsx4 已迁往 modules/animevideo）

# ---- 权重变体：ncnn param+bin（vulkan 兜底）----
# 上游无独立模型包资产：模型捆绑在引擎 portable 包内（binaries+models 一体）。
# url 指 Linux(NAS 首选) 整包；Windows 用户改取 -windows.zip（README 有直链）。
# zip 不在平台 URL 自动解压范围（仅 tar.gz/tgz），下载后请手动解压或走浏览器上传导入。

[[models]]
id = "realesrgan-animevideov3-x4-ncnn"
name = "RealESRGAN animevideov3 x4 (ncnn/vulkan 兜底)"
source = "url"
url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip"
target_dir = "realesr-animevideov3-x4-ncnn"
size_estimate_mb = 45
qualified_id = "xinntao.realesrgan.animevideov3-x4-ncnn"

# ---- OpenVINO ONNX 变体（E7 已落地：自建导出）----
# 上游不发官方 ONNX（决策备忘录 §1.2）；社区件输入固定 128px 不可用。
# 按裁决自建：scripts/export_onnx.py 从同源 pth 导出 dynamic-shape ONNX
# （opset17/18，N/H/W 动轴），经 PSNR 对拍核验后作为 openvino 后端权威权重。
# source=local_import：不随 URL 分发，获取方式见 README「ONNX 权重获取」
# （自行运行导出脚本或平台本地导入）。许可随源权重 BSD-3-Clause。
[[models]]
id = "realesr-animevideov3-onnx"
name = "RealESR animevideov3 x4 (ONNX/OpenVINO·自建)"
source = "local_import"
target_dir = "realesr-animevideov3-onnx"
size_estimate_mb = 1
qualified_id = "xinntao.realesrgan.animevideov3-x4-onnx"

[interface]
type = "http"
health_endpoint = "/health"
ready_timeout_secs = 60

[[interface.capabilities]]
name = "upscale"
description = "视频超分辨率放大（抽帧→逐帧 SR→回封 mp4，音频流 copy）"
input_type = "video"
output_type = "video"
max_file_size_mb = 4096

[interface.capabilities.params]
scale_factor = { type = "integer", default = 4, min = 2, max = 4, description = "放大倍率（ncnn 引擎支持 2/3/4；torch x4plus 仅 4）" }
target_preset = { type = "select", options = ["fast", "balanced", "quality"], default = "balanced", description = "画质-速度档位：fast=视频轻量模型优先 / balanced=默认平衡 / quality=照片级大模型" }
tile_size = { type = "integer", default = 256, min = 0, max = 1024, description = "推理 tile 边长（0=自动；显存不足时调小）" }
