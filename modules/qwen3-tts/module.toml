[module]
id = "qwen3-tts"
name = "Qwen3-TTS 语音合成"
version = "1.0.0"
description = "基于 Qwen3 的高质量多语言语音合成"
category = "tts"
genre = "qwen-tts"
authors = ["EntryPoint Community"]
license = "Apache-2.0"
homepage = "https://github.com/QwenLM/Qwen3-TTS"
tags = ["tts", "speech-synthesis", "multilingual", "chinese"]

[runtime]
type = "python"
python_version = ">=3.10,<3.13"
requirements = "requirements.txt"
entrypoint = "adapter.py"
start_command = "{venv_python} {MODULE_DIR}/{entrypoint}"

[compute]
backends = ["cuda", "cpu"]
default_backend = "cuda"
vram_estimate_mb = 3000
min_vram_mb = 2048

[compute.env]
cuda = { CUDA_VISIBLE_DEVICES = "{device_index}" }

# ModelScope 实际仓库名为 Qwen3-TTS-12Hz-*（2026-08-05 经
# https://modelscope.cn/api/v1/models/<repo_id> 逐一核实；
# 旧 repo_id "Qwen/Qwen3-TTS-{1.7B,0.6B}" 均返回 record not found）。
[[models]]
id = "1.7b"
name = "Qwen3-TTS 1.7B (高质量)"
source = "modelscope"
repo_id = "Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice"
target_dir = "qwen3-tts-1.7b"
size_estimate_mb = 4500
default = true

[[models]]
id = "0.6b"
name = "Qwen3-TTS 0.6B (轻量)"
source = "modelscope"
repo_id = "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
target_dir = "qwen3-tts-0.6b"
size_estimate_mb = 2500

[interface]
type = "http"
health_endpoint = "/health"
ready_timeout_secs = 120

[[interface.capabilities]]
name = "synthesize"
description = "文本转语音，输出 WAV 音频文件"
input_type = "text"
output_type = "audio"

[interface.capabilities.params]
voice = { type = "string", default = "default", description = "音色名称" }
speed = { type = "float", default = 1.0, min = 0.5, max = 2.0, step = 0.1, description = "语速倍率" }
sample_rate = { type = "integer", default = 24000, description = "输出采样率" }
