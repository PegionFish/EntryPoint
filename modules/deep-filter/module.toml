[module]
id = "deep-filter"
name = "DeepFilter 音频降噪"
version = "0.5.6"
description = "基于 DeepFilterNet 的深度学习语音增强/降噪"
category = "denoise"
genre = "deep-filter"
authors = ["EntryPoint Community"]
license = "MIT"
homepage = "https://github.com/Rikorose/DeepFilterNet"
tags = ["denoise", "audio", "enhancement", "realtime"]

[runtime]
type = "python"
python_version = ">=3.10,<3.13"
requirements = "requirements.txt"
entrypoint = "adapter.py"
start_command = "{venv_python} {MODULE_DIR}/{entrypoint}"

[compute]
backends = ["cuda", "cpu"]
default_backend = "cpu"
vram_estimate_mb = 512
min_vram_mb = 256

[compute.env]
cuda = { CUDA_VISIBLE_DEVICES = "{device_index}" }

[[models]]
id = "df3"
name = "DeepFilterNet3 (默认)"
source = "url"
# 原 GitHub release 资产已失效（所有 release 均无此文件）；改用 HuggingFace 镜像（文件内容与原版一致，2026-08-04 核实）
url = "https://huggingface.co/Serkan007/DeepFilterNet3-ONNX/resolve/main/DeepFilterNet3_onnx.tar.gz"
target_dir = "deep-filter-df3"
size_estimate_mb = 8
default = true

[interface]
type = "http"
health_endpoint = "/health"
ready_timeout_secs = 30

[[interface.capabilities]]
name = "denoise"
description = "AI 语音降噪，输出增强后的音频文件"
input_type = "audio"
output_type = "audio"
max_file_size_mb = 500

[interface.capabilities.params]
attenuation = { type = "integer", default = 100, min = 0, max = 100, description = "降噪强度 (dB)" }
min_db = { type = "float", default = -60.0, min = -100.0, max = 0.0, step = 1.0, description = "最小增益 (dB)" }
# ---- A6：源应用 libDF CLI（enhance_wav）参数面对齐（全部追加式）----
post_filter = { type = "boolean", default = false, description = "启用后置滤波（高噪段补偿）" }
pf_beta = { type = "float", default = 0.02, min = 0.0, max = 2.0, step = 0.01, description = "后置滤波强度" }
min_db_thresh = { type = "float", default = -15.0, min = -100.0, max = 0.0, step = 1.0, description = "DNN 本地 SNR 阈值下限" }
max_db_erb_thresh = { type = "float", default = 35.0, min = 0.0, max = 100.0, step = 1.0, description = "ERB 解码器 SNR 上限" }
max_db_df_thresh = { type = "float", default = 35.0, min = 0.0, max = 100.0, step = 1.0, description = "DF 解码器 SNR 上限" }
reduce_mask = { type = "integer", default = 1, min = 1, max = 2, description = "多声道 mask 归并 1=max 2=mean" }
compensate_delay = { type = "boolean", default = false, description = "补偿 STFT/模型 lookahead 延迟" }
