[workspace]
resolver = "2"
members = [
    "crates/ep-core",
    "crates/ep-daemon",
    "crates/ep-desktop",
    "crates/ep-pack",
    "crates/ep-pack-cli",
    "crates/ep-webui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["EntryPoint Contributors"]

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# GUI
eframe = "0.31"
egui = "0.31"
egui_extras = "0.31"
rfd = "0.15"

# Internal
ep-core = { path = "crates/ep-core" }
ep-pack = { path = "crates/ep-pack" }
ep-pack-cli = { path = "crates/ep-pack-cli" }
