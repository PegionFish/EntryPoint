[package]
name = "ep-pack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# §4.3 统一消费：清单校验使用 ep-core 的 model_id（QualifiedId）与 ComputeBackend
ep-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
chrono.workspace = true
# 整合包归档容器：标准 zip 与 tar.gz（依赖写法与 ep-daemon 的 api/upload.rs 解包侧保持一致）
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# CHECKSUMS.toml 全量校验（sha256）
sha2 = "0.11"
hex = "0.4"
# 打包时递归枚举源目录文件
walkdir = "2"

[dev-dependencies]
# 集成测试（tests/import_flow.rs）构造恶意/篡改归档需要直接写 zip 条目
zip = { version = "2", default-features = false, features = ["deflate"] }
