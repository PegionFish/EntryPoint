[package]
name = "ep-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EntryPoint Windows 托盘管理器 — ep-daemon sidecar 壳（托盘图标/菜单/守护进程托管，零 webview）"

# T-33 编译策略（spike）：全部 tray 依赖收进 cfg(windows) 门——非 Windows 目标
# 只编译空壳（纯逻辑模块 + 打印提示退出的 main），Linux/CI 无需 GTK/系统库
# 即可 `cargo check`。源码侧对应 `#[cfg(windows)]` / `cfg!(windows)` 门控。
[target.'cfg(windows)'.dependencies]
# 托盘图标与原生菜单（Windows 后端无需 GTK；事件经 set_event_handler
# 桥入 eframe 主循环——2026-11-05 GT-1：tao 退役，托盘与 GUI 同线程共存）
tray-icon = "0.26"
# GUI 事件循环（winit 底座）：主窗口 + 托盘事件轮询宿主。
# 精确 pin：eframe/egui 版本面变动大，锁死 0.37.0 便于 GT-2~4 接线
eframe = "=0.37.0"
# GT-2 状态页轮询（PR 报备新增依赖）：blocking HTTP 客户端，只访问
# 127.0.0.1:<port>/api/* 明文回环——default-features=false 关掉 TLS/gzip，
# 产物面最小；请求超时见 platform/probe_ext.rs（红线：绝不阻塞超 3s）
ureq = { version = "2", default-features = false }
# 轮询快照反序列化（serde derive）：daemon 响应反序列化成自有快照 struct，
# 不透传 raw serde_json::Value（UiShared 扩展面类型化）
serde = { workspace = true }
serde_json = { workspace = true }
# GT-4 LogPipe WsSource（PR 报备新增依赖）：blocking WebSocket 客户端，订阅
# ws://127.0.0.1:<port>/ws/logs 模块日志流。本机回环明文 ws://，无需任何 TLS
# 特性——default-features=false 仅保留 handshake（客户端连接必需）；版本面
# 0.29 与锁内既有传递版本一致（不引入新编译单元）。轮询/重连语义见
# platform/logpipe/ws_source.rs（红线：IO 全在 logpipe 线程，绝不阻塞 UI）
tungstenite = { version = "0.29", default-features = false, features = [
    "handshake",
] }
# HKCU\Software\Microsoft\Windows\CurrentVersion\Run 读写（开机自启开关）
winreg = "0.56"
# 命名互斥体（单实例锁；仅 Win32_Foundation + Win32_System_Threading 两个特性面）
# GT-5 报备：+Win32_System_Time（日志页 ts 本地时区显示——FileTimeToSystemTime
# /SystemTimeToTzSpecificLocalTime，不引 chrono；FILETIME/SYSTEMTIME 在既有
# Win32_Foundation 面内）
# GT-3 报备：+Win32_System_Services（SCM 管控面——OpenSCManager/OpenService/
# QueryServiceStatusEx/QueryServiceConfig(2)/ControlService/StartService，
# platform/scm.rs 双模式管控与模式检测；只读 query 标准用户可用）
# GT-3 报备：+Win32_UI_Shell（elevate.rs 自提权——ShellExecuteExW runas verb
# + SEE_MASK_NOCLOSEPROCESS 等待一次性动作进程退出码）
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Services",
    "Win32_UI_Shell",
] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
rfd = "0.17.2"
